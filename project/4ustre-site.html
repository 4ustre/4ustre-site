const WORK=[
 {title:"Debesų knyga",meta:"2025 · Book cover",client:"Tyto alba",text:"A cover for Rasa's second novel. Gouache on rough paper, three greens and one crow. Printed on uncoated cream stock, two passes."},

}

 return (<div className="sheet" onClick={close}>

 </div>);

function Home({go}){
 const [open,setOpen]=useState(null);
 const galRef=useRef(null),trackRef=useRef(null);
 useEffect(()=>{
  if(!window.gsap||!window.ScrollTrigger)return;
  const track=trackRef.current,gal=galRef.current;
  const ctx=gsap.context(()=>{
   const dist=()=>Math.max(0,track.scrollWidth-window.innerWidth);
   gsap.to(track,{x:()=>-dist(),ease:"none",scrollTrigger:{trigger:gal,start:"top top",end:()=>"+="+dist(),pin:true,scrub:.6,invalidateOnRefresh:true,anticipatePin:1}});
  },gal);
  const t=setTimeout(()=>ScrollTrigger.refresh(),300);
  const fctx=gsap.context(()=>{gsap.from(".ftbounce",{y:120,opacity:0,duration:1.1,ease:"elastic.out(0.9,0.5)",scrollTrigger:{trigger:".ftbounce",start:"top 92%",once:true}})});
  return()=>{clearTimeout(t);ctx.revert();fctx.revert()};
 },[]);
 const heroRef=useRef(null);
 useEffect(()=>{
  if(!window.gsap)return;
  const ctx=gsap.context(()=>{
   const tl=gsap.timeline({defaults:{ease:"power3.out"}});
   tl.from(".hero-logo",{scale:3.4,opacity:0,duration:.9,ease:"elastic.out(0.85,0.62)"})
     .from(".hero-logo",{rotation:-6,duration:.5,ease:"back.out(3)"},"-=0.45")
     .from(".hero-letter",{yPercent:120,rotation:i=>i%2?9:-9,opacity:0,duration:.55,stagger:{each:.035,from:"start"},ease:"back.out(2.6)"},"-=0.25")
     .from(".hero-word",{y:14,opacity:0,duration:.4,stagger:.06},"-=0.15");
   if(window.ScrollTrigger){
    const run=heroRef.current.querySelector(".taglineRun"),p1=run.querySelector("p");
    const base=()=>-p1.offsetWidth/2;
    gsap.set(run,{x:base()});
    gsap.fromTo(run,{x:base()},{x:()=>base()-window.innerWidth*.5,ease:"none",scrollTrigger:{trigger:heroRef.current,start:"top top",end:"bottom top",scrub:.5,invalidateOnRefresh:true}});
   }
  },heroRef);
  return()=>ctx.revert();
 },[]);
 const toWork=()=>{const el=document.getElementById("work");if(el)window.scrollTo({top:el.offsetTop,behavior:"smooth"})};
 return (<div>
  <div ref={heroRef} data-section="rose" style={{minHeight:"100vh",display:"flex",flexDirection:"column",padding:"48px 96px 64px",boxSizing:"border-box"}}>
   <div style={{display:"flex",justifyContent:"center"}}>
    <nav className="navlinks">
     <button className="navlink" onClick={()=>go("work")}>Work</button>
     <button className="navlink" onClick={()=>go("about")}>About</button>
     <button className="navlink" onClick={()=>go("contact")}>Contact</button>
    </nav>
   </div>
   <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",textAlign:"center",gap:40}}>
    <div className="hero-logo"><Logo variant="mark" size={148}/></div>
    <div>
     <h1 style={{fontSize:88,lineHeight:.98,letterSpacing:"-0.02em",margin:0,overflow:"hidden",padding:"0 0 .08em"}}>{"Austė Vagoraitė".split("").map((c,i)=>c===" "?<span key={i} style={{display:"inline-block",width:".26em"}}> </span>:<span className="hero-letter" key={i}>{c}</span>)}</h1>
     <div className="taglineWrap"><div className="taglineRun"><p>{"thinking world into images".split(" ").map((w,i)=><span className="hero-word" key={i} style={{marginRight:".32em"}}>{w}</span>)}</p><p aria-hidden="true">thinking world into images</p><p aria-hidden="true">thinking world into images</p></div></div>
    </div>
   </div>
  </div>
  <section id="work" ref={galRef} data-section="sage" className="workband hgal">
   <div className="hstage">
    <div className="htrack" ref={trackRef}>
     {WORK.map(w=>(
      <div className="hitem" key={w.title}>
       <button className="zoomcard" onClick={()=>setOpen(w)} aria-label={w.title}>
        <div className="zoomclip"><ImageFrame ratio="1 / 1" fill="var(--paper-deep)" alt={w.title}/></div>
       </button>
      </div>))}
    </div>
   </div>
  </section>
  <section className="page ftbounce" data-section="sage" style={{paddingTop:128,paddingBottom:160,background:"var(--surface-field)",maxWidth:"none"}}>
   <div className="grid12">
    <div style={{gridColumn:"1/7"}}>
     <Label rule>Selected work</Label>
     <h2 style={{fontSize:56,lineHeight:1.02,letterSpacing:"-0.02em",margin:"24px 0 0"}}>Text goes here.</h2>
    </div>
    <p style={{gridColumn:"8/-1",alignSelf:"end",margin:0,color:"var(--ink-60)"}}>Room for a paragraph — send me the copy and I'll set it.</p>
   </div>
  </section>
  <WorkSheet item={open} close={()=>setOpen(null)} go={go}/>
 </div>);
}

function ProjectBody({w,smallText,go}){
 return (<div className="page" style={{paddingTop:0}}>
  <div className="grid12" style={{rowGap:96}}>
   <div style={{gridColumn:"1/3"}}><p style={smallText}>{w.text}</p></div>

 </div>);

function Project({item,go}){
 const start=Math.max(0,WORK.findIndex(x=>x.title===(item||WORK[0]).title));
 const wrapRef=useRef(null);
 const smallText={font:"300 14px/1.6 'Hanken Grotesk',Arial,sans-serif",color:"var(--ink-60)",margin:0};
 useEffect(()=>{
  if(!window.gsap||!window.ScrollTrigger)return;
  const ctx=gsap.context(()=>{
   gsap.utils.toArray(".ppanel").forEach(panel=>{
    const cover=panel.querySelector(".pcover");
    ScrollTrigger.create({trigger:panel,start:"top top",end:()=>"+="+Math.max(1,panel.offsetHeight-window.innerHeight),pin:cover,pinSpacing:false,invalidateOnRefresh:true,anticipatePin:1});
    gsap.to(cover,{opacity:0,scale:.96,ease:"none",scrollTrigger:{trigger:panel,start:"top top",end:()=>"+="+window.innerHeight*.8,scrub:.4,invalidateOnRefresh:true}});
   });
  },wrapRef);
  const jump=()=>{
   ScrollTrigger.refresh();
   const el=wrapRef.current.querySelectorAll(".ppanel")[start];
   if(el)window.scrollTo(0,el.offsetTop);
  };
  const t=setTimeout(jump,250);
  const onScroll=()=>{
   const max=document.documentElement.scrollHeight-window.innerHeight;
   if(max>0&&window.scrollY>=max-2){window.scrollTo(0,1);ScrollTrigger.refresh()}
  };
  window.addEventListener("scroll",onScroll,{passive:true});
  return()=>{clearTimeout(t);window.removeEventListener("scroll",onScroll);ctx.revert()};
 },[start]);
 return (<div ref={wrapRef} data-section="terracotta">
  <div className="page" style={{paddingBottom:0}}><Nav page="work" go={go}/></div>
  {WORK.map((w,i)=>(
   <article className="ppanel" key={w.title}>
    <div className="pcover">
     <div className="pcover-in">
      <div style={{gridColumn:"1/6"}}>
       <div style={{font:"400 clamp(96px,13vw,180px)/0.86 'Instrument Serif',Georgia,serif",letterSpacing:"-0.03em",color:"var(--ink-38)",marginBottom:24}}>{String(i+1).padStart(2,"0")}</div>
       <Label rule>{w.meta}</Label>
       <h1 style={{fontSize:64,lineHeight:1.02,letterSpacing:"-0.02em",margin:"24px 0 24px"}}>{w.title}</h1>
       <p style={smallText}>{w.client}</p>
      </div>
      <div style={{gridColumn:"7/-1"}}><ImageFrame ratio="4 / 3" fill="var(--paper-deep)" alt={w.title}/></div>
     </div>
    </div>
    <ProjectBody w={w} smallText={smallText} go={go}/>
   </article>))}
  <section className="page" style={{paddingTop:0,paddingBottom:0}}></section>
 </div>);
}

function App(){
 const [page,setPage]=useState("home");
 const [item,setItem]=useState(null);
